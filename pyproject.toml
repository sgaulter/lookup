[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lookup"
version = "0.1.0"
description = "A selection lookup popup for Linux desktops"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = ["markdown-it-py>=3,<5"]

[project.scripts]
lookup = "lookup.app:main"

[tool.setuptools.package-data]
lookup = ["default-config.toml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE"]
